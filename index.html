<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zìkǎ 字卡</title>
  <meta name="description" content="Flashcards pour apprendre le chinois, avec répétition espacée.">

  <!-- Installation sur l'écran d'accueil -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Zìkǎ">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#e9eeec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101614" media="(prefers-color-scheme: dark)">

  <!-- Polices -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">

  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><b>字卡</b><span>Zìkǎ</span></div>
    <nav>
      <button id="tab-review" aria-current="true">Réviser</button>
      <button id="tab-cards">Cartes</button>
      <button id="tab-settings">Réglages</button>
    </nav>
  </header>
  <div class="stats" id="stats"></div>
  <main id="view"></main>
</div>

<script src="app.js"></script>
<script>
  // Mode hors-ligne : enregistre le service worker (ignoré si on ouvre le fichier en local)
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>
